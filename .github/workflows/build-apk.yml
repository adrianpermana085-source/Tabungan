
name: Build Tabungan 100 Juta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tabungan100Juta_AndroidStudio.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: unzip -q Tabungan100Juta_AndroidStudio.zip -d source

      - name: Build debug APK
        working-directory: source/Tabungan100JutaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabungan100Juta-debug-apk
          path: source/Tabungan100JutaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
